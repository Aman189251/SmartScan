[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartscan-strategy"
version = "1.0.0"
description = "Adaptive machine-learning scan scheduling for a constrained electronic support receiver"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - research prototype" }

dependencies = [
    "PySide6==6.10.1",
    "pyqtgraph==0.13.7",
    "matplotlib==3.10.6",
    "numpy==2.2.6",
    "pandas==2.3.2",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
    "xgboost==3.0.5",
    "joblib==1.5.2",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "pydantic==2.11.7",
    "httpx==0.28.1",
    "SQLAlchemy==2.0.43",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pyinstaller==6.15.0"]

[project.scripts]
smartscan-api = "backend.app.main:serve"

[tool.setuptools]
packages = ["backend", "backend.app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
